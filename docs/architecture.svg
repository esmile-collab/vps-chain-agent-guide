<title id="title">VPS 搭建 Agent：系统架构与反馈闭环</title>
<desc id="desc">把部署、验收、排障和回退整理成可复查的流程。需求与授权：预算 · 设备 · 用途；方案研究与门槛：现时证据 · 费用；部署与设备配置：预检 · 部署 · 配置；测试与验收：连通 · 安全 · 复测；故障证据与限制：失败层级 · 版本现象；分层排障与回退：恢复后逐项修改；交接记录与已知问题：测试结果 · 版本 · 回退点 · 兼容性限制；验收与交接：复测结果 · 恢复入口。Skill 规定流程；Agent 执行检查，高风险修改由用户确认。 出现失败先恢复已验证层；凭据和具体实例记录保留在仓库外。</desc>
